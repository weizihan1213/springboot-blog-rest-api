spring.application.name=springboot-blog-rest-api
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Specify the MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Specify the JWT secret
jwt.secret=47dccc6651735af3fac3d84af843de6326ae188ef26284956218e63d1ffa4435
jwt.expiration=604800000

# Activate the Health and Info endpoint
management.endpoints.web.exposure.include=health,info